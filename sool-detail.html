<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sool Detail</title>
  <link rel="stylesheet" href="shared.css">
  <!-- Amplitude Analytics -->
  <script src="https://cdn.amplitude.com/libs/analytics-browser-2.11.1-min.js.gz"></script>
  <script>
    window.amplitude.init("5c9108f6f1aeab52f56dad94c7fa81e8", { autocapture: true });
  </script>
  <style>
    .detail-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      max-height: 50vh;
      overflow: hidden;
      border-radius: 0 0 24px 24px;
    }
    .detail-hero-bg {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 80px;
    }
    .detail-hero-bg > span { opacity: 0.4; }
    .detail-hero-bg > img { opacity: 1; }
    .detail-hero-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(45,41,38,0.7) 0%, transparent 100%);
      padding: 64px 24px 24px;
    }
    .detail-hero-title {
      font-size: 28px; font-weight: 700; color: white;
      font-family: 'Playfair Display', Georgia, serif;
      line-height: 1.2;
    }
    .detail-hero-sub { font-size: 16px; color: rgba(255,255,255,0.8); margin-top: 4px; }
    .detail-badge {
      position: absolute; top: 16px; right: 16px;
      background: rgba(254,252,249,0.9);
      backdrop-filter: blur(8px);
      font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 9999px;
      color: var(--charcoal-900);
    }
    .detail-meta {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 20px;
    }
    .meta-chip {
      font-size: 13px; font-weight: 500;
      padding: 6px 12px; border-radius: 9999px;
      background: var(--cream-100); color: var(--charcoal-700);
      border: 1px solid var(--cream-200);
    }
    .detail-section { padding: 0 20px 24px; }
    .detail-section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--buncheong); margin-bottom: 12px;
    }
    /* Western match */
    .western-card {
      background: var(--cream-100); border-radius: 16px;
      padding: 20px; border: 1px solid var(--cream-200);
    }
    .western-header {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--buncheong); margin-bottom: 12px;
    }
    .western-comparison {
      display: flex; align-items: center; gap: 12px;
      justify-content: center;
    }
    .western-item { text-align: center; }
    .western-item-icon { font-size: 32px; }
    .western-item-label { font-size: 14px; margin-top: 4px; }
    .western-desc {
      font-size: 14px; color: var(--charcoal-500);
      margin-top: 12px; text-align: center; font-style: italic;
    }
    /* Taste bars */
    .taste-bars { display: flex; flex-direction: column; gap: 12px; }
    .taste-bar-row {
      display: flex; align-items: center; gap: 12px;
    }
    .taste-bar-label {
      width: 56px; font-size: 12px; font-weight: 600;
      color: var(--charcoal-500); text-transform: capitalize;
    }
    .taste-bar-track {
      flex: 1; height: 8px; border-radius: 9999px;
      background: var(--cream-200); overflow: hidden;
    }
    .taste-bar-fill {
      height: 100%; border-radius: 9999px;
      transition: width 0.5s ease-out;
    }
    .taste-bar-val {
      width: 32px; font-size: 12px; font-weight: 600;
      text-align: right; color: var(--charcoal-500);
    }
    /* Food pairing */
    .food-scroll {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
    }
    .food-item {
      flex-shrink: 0; display: flex; flex-direction: column;
      align-items: center; width: 80px;
    }
    .food-img {
      width: 64px; height: 64px; border-radius: 12px;
      background: var(--cream-200);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .food-name {
      font-size: 12px; color: var(--charcoal-700);
      margin-top: 6px; text-align: center; line-height: 1.3;
    }
    /* Order phrase */
    .order-card {
      background: var(--cream-50); border-radius: 16px;
      padding: 20px; border: 1px solid var(--cream-200);
      margin-bottom: 12px;
    }
    .order-situation {
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--buncheong); margin-bottom: 12px;
    }
    .order-korean {
      font-size: 24px; font-weight: 700; color: var(--charcoal-900);
      font-family: 'Noto Sans KR', sans-serif; line-height: 1.5;
    }
    .order-romanized {
      font-size: 14px; color: var(--charcoal-500); margin-top: 8px; font-style: italic;
    }
    .order-english {
      font-size: 14px; color: var(--buncheong); margin-top: 4px;
    }
    .order-actions {
      display: flex; gap: 12px; margin-top: 16px;
    }
    .order-actions button {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600;
      border: none; cursor: pointer;
    }
    .copy-btn { background: var(--cream-100); color: var(--charcoal-900); }
    .show-btn { background: var(--dancheong); color: white; }
    .desc-text {
      font-size: 16px; line-height: 1.6; color: var(--charcoal-700);
    }
    .spot-link {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 0;
      text-decoration: none; color: var(--celadon);
      font-size: 15px; font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Top nav -->
  <nav class="top-nav">
    <button class="back-btn" onclick="history.back()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
    <span class="nav-title" id="nav-title"></span>
    <span class="nav-action"></span>
  </nav>

  <div class="page-content" id="detail-content"></div>

  <!-- Full screen overlay for order phrase -->
  <div class="fullscreen-overlay" id="show-overlay" style="display:none">
    <button class="close-btn" onclick="document.getElementById('show-overlay').style.display='none'">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div id="show-korean" style="font-size:40px;font-weight:700;color:var(--charcoal-900);text-align:center;font-family:'Noto Sans KR',sans-serif"></div>
    <div id="show-english" style="font-size:18px;color:var(--buncheong);margin-top:16px;text-align:center"></div>
  </div>

  <script src="shared.js"></script>
  <script>
    document.body.insertAdjacentHTML('beforeend', renderTabBar('list'));

    const FOOD_EMOJIS = {
      pajeon: '\uD83E\uDDC6', bossam: '\uD83C\uDF56', jeon: '\uD83E\uDDC6',
      kimchi: '\uD83E\uDD6C', tteok: '\uD83C\uDF58', cheese: '\uD83E\uDDC0',
      chicken: '\uD83C\uDF57', samgyeopsal: '\uD83E\uDD53', galbi: '\uD83C\uDF56',
      bibimbap: '\uD83C\uDF5C', default: '\uD83C\uDF7D'
    };

    function getFoodEmoji(name) {
      const lower = name.toLowerCase();
      for (const [key, emoji] of Object.entries(FOOD_EMOJIS)) {
        if (lower.includes(key)) return emoji;
      }
      return FOOD_EMOJIS.default;
    }

    function showPhrase(korean, english) {
      document.getElementById('show-korean').textContent = korean;
      document.getElementById('show-english').textContent = english;
      document.getElementById('show-overlay').style.display = 'flex';
    }

    async function init() {
      const id = getParam('id');
      if (!id) { window.location.href = 'sool-guide.html'; return; }

      const [data, imageData] = await Promise.all([getSools(), getImages()]);
      const sool = data.items.find(s => s.id === id);
      if (!sool) { window.location.href = 'sool-guide.html'; return; }

      document.getElementById('nav-title').textContent = sool.name;
      document.title = `${sool.name} - Sool`;

      const imgUrl = getSoolImageUrl(imageData, sool.id, sool.category);
      const container = document.getElementById('detail-content');
      const tasteEntries = Object.entries(sool.tasteProfile);

      container.innerHTML = `
        <!-- Hero -->
        <div class="detail-hero">
          <div class="detail-hero-bg" style="background:${getPlaceholderGradient(sool.category)}">
            ${imgUrl
              ? `<img src="${imgUrl}" alt="${sool.name}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none;opacity:0.4">${getCategoryEmoji(sool.category)}</span>`
              : `<span style="opacity:0.4">${getCategoryEmoji(sool.category)}</span>`
            }
          </div>
          <div class="detail-hero-overlay">
            <div class="detail-hero-title">${sool.name}</div>
            <div class="detail-hero-sub">${sool.nameKo} &middot; ${sool.abv}% ABV</div>
          </div>
          <div class="detail-badge">${sool.productionType === 'artisanal' ? 'Artisanal' : 'Mass-produced'}</div>
        </div>

        <!-- Meta chips -->
        <div class="detail-meta">
          <span class="meta-chip">${CATEGORY_NAMES[sool.category] || sool.category}</span>
          <span class="meta-chip abv-badge ${abvBadgeClass(sool.abv)}">${sool.abv}% ABV</span>
          <span class="meta-chip">${sool.volume}</span>
          <span class="meta-chip">${sool.region}</span>
          ${sool.priceRange ? `<span class="meta-chip">${sool.priceRange} ${priceDisplay(sool.priceRange)}</span>` : ''}
        </div>

        <!-- One-liner -->
        ${sool.oneLiner ? `<div style="padding:0 20px 20px;font-size:17px;font-weight:500;color:var(--charcoal-700);font-style:italic">"${sool.oneLiner}"</div>` : ''}

        <!-- Western Match -->
        ${sool.westernMatch ? `
        <div class="detail-section">
          <div class="western-card">
            <div class="western-header">If you like...</div>
            <div class="western-comparison">
              <div class="western-item">
                <div class="western-item-icon">\uD83C\uDF76</div>
                <div class="western-item-label" style="color:var(--charcoal-500)">${sool.westernMatch.similar}</div>
              </div>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C4463A" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
              <div class="western-item">
                <div class="western-item-icon">${getCategoryEmoji(sool.category)}</div>
                <div class="western-item-label" style="font-weight:600">${sool.name.split(' ')[0]}</div>
              </div>
            </div>
            <div class="western-desc">${sool.westernMatch.description}</div>
          </div>
        </div>
        ` : ''}

        <!-- Taste Profile -->
        <div class="detail-section">
          <div class="detail-section-title">Taste Profile</div>
          <div class="taste-bars">
            ${tasteEntries.map(([taste, val]) => `
              <div class="taste-bar-row">
                <span class="taste-bar-label">${taste}</span>
                <div class="taste-bar-track">
                  <div class="taste-bar-fill" style="width:${val}%;background:${TASTE_COLORS[taste] || '#9B9590'}"></div>
                </div>
                <span class="taste-bar-val">${val}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Description -->
        <div class="detail-section">
          <div class="detail-section-title">About This Sool</div>
          <p class="desc-text">${sool.description}</p>
        </div>

        <!-- Food Pairings -->
        ${sool.foodPairings && sool.foodPairings.length > 0 ? `
        <div class="detail-section">
          <div class="detail-section-title">Pairs Well With</div>
          <div class="food-scroll scrollbar-hide">
            ${sool.foodPairings.map(f => `
              <div class="food-item">
                <div class="food-img">${getFoodEmoji(f.name)}</div>
                <div class="food-name">${f.name}<br><span style="font-size:11px;color:var(--buncheong)">${f.nameKo}</span></div>
              </div>
            `).join('')}
          </div>
        </div>
        ` : ''}

        <!-- Order Phrases -->
        ${sool.orderPhrases && sool.orderPhrases.length > 0 ? `
        <div class="detail-section">
          <div class="detail-section-title">How to Order</div>
          ${sool.orderPhrases.map(p => `
            <div class="order-card">
              <div class="order-situation">${p.situation}</div>
              <div class="order-korean">${p.korean}</div>
              <div class="order-romanized">${p.romanized}</div>
              <div class="order-english">${p.english}</div>
              <div class="order-actions">
                <button class="copy-btn" onclick="copyToClipboard('${p.korean.replace(/'/g, "\\'")}', this)">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9.75a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184"/></svg>
                  Copy
                </button>
                <button class="show-btn" onclick="showPhrase('${p.korean.replace(/'/g, "\\'")}', '${p.english.replace(/'/g, "\\'")}')">Show to Staff</button>
              </div>
            </div>
          `).join('')}
        </div>
        ` : ''}

        <div style="padding-bottom:32px"></div>
      `;

      // Animate taste bars
      setTimeout(() => {
        document.querySelectorAll('.taste-bar-fill').forEach(bar => {
          bar.style.width = bar.style.width;
        });
      }, 100);
    }

    init();
  </script>
</body>
</html>
