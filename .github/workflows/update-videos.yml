name: Update YouTube videos

on:
  schedule:
    # Runs every Sunday at 00:05 UTC (= 09:05 AM Asia/Seoul).
    # GitHub Actions occasionally delays scheduled jobs by several minutes.
    - cron: '5 0 * * 0'
  workflow_dispatch: {}  # allow manual trigger from the Actions tab

permissions:
  contents: write  # needed to commit & push the updated JSON

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest videos and rewrite data/videos.json
        run: python3 .github/scripts/update_videos.py

      - name: Commit & push if changed
        run: |
          if [[ -z "$(git status --porcelain data/videos.json)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "chore: refresh latest YouTube videos"
          git push
